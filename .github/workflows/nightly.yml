# Nightly: сборка на каждый коммит. Для коммитов в main — пре-релиз на GitHub
# с тегом vYYYYMMDD.N, где N — номер сборки за день.
name: nightly

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Сборки идут по очереди, иначе две могут взять один и тот же номер.
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: out

      - name: Pick tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%Y%m%d)
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$day." --jq '.[].ref' \
            | sed "s|refs/tags/v$day\.||" | sort -n | tail -1)
          echo "tag=v$day.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # md2pdfX-<version>-<platform>-<arch>.<архив>, расширение — md2pdfX-<version>.vsix
          version=${TAG#v}
          mv out/*.vsix "out/md2pdfX-$version.vsix"
          for f in out/md2pdfX-*-*.*; do
            case $f in *.vsix) continue ;; esac
            mv "$f" "out/md2pdfX-$version-${f#out/md2pdfX-}"
          done
          ls out
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly $TAG" \
            --notes "Nightly build of ${GITHUB_SHA::7}. Extension: Extensions → … → Install from VSIX. CLI: unpack md2pdfX-<version>-<platform>-<arch> and run \`md2pdf doc.md\`."
