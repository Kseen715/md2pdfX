# Nightly: сборка на каждый коммит. Для коммитов в main — пре-релиз на GitHub
# с тегом vYYYYMMDD.N, где N — номер сборки за день.
name: nightly

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Сборки идут по очереди, иначе две могут взять один и тот же номер.
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Pick tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%Y%m%d)
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$day." --jq '.[].ref' \
            | sed "s|refs/tags/v$day\.||" | sort -n | tail -1)
          echo "tag=v$day.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mv *.vsix "md2pdfx-$TAG.vsix"
          gh release create "$TAG" "md2pdfx-$TAG.vsix" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly $TAG" \
            --notes "Nightly build of ${GITHUB_SHA::7}. Install: Extensions → … → Install from VSIX."
