# Общая сборка для nightly и релиза: .vsix и исполняемые файлы под каждую
# платформу, окно на Electron. Всё, что попадает в релиз, выкладывается артефактами dist-*.
name: build

on:
  workflow_call:

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Заодно проверка конвейера целиком: на раннере стоит Google Chrome.
      - name: Build examples
        run: npm run examples

      - name: Package extension
        run: npm run package:ext

      - uses: actions/upload-artifact@v7
        with:
          name: dist-vsix
          path: dist/*.vsix
          if-no-files-found: error

  exe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: windows-latest, platform: windows, arch: x64 }
          - { os: macos-latest, platform: macos, arch: arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node --build-sea появился в Node 25.5.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build:exe

      - name: Smoke test
        run: |
          exe=dist/md2pdf; [ "$RUNNER_OS" = Windows ] && exe=dist/md2pdf.exe
          "$exe" --version
          # Под Linux arm64 нет ни Google Chrome, ни chrome-headless-shell:
          # там бинарнику нужен системный Chromium, на раннере его нет.
          if [ "${{ matrix.platform }}-${{ matrix.arch }}" != linux-arm64 ]; then
            "$exe" examples/math.md -o "$RUNNER_TEMP/"
          fi

      # Сам бинарник ~150 МБ (внутри Node.js), в архиве — втрое меньше.
      # Версию в имя вставляет задача релиза: только она знает тег.
      - name: Archive
        run: |
          name=md2pdfX-${{ matrix.platform }}-${{ matrix.arch }}-cli
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "out/$name.zip" ./dist/md2pdf.exe
          else
            tar -czf "out/$name.tar.gz" -C dist md2pdf
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # Окно: Electron под x64 и arm64 собирается на одной ОС (packager скачивает
  # нужный), поэтому по задаче на ОС.
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: windows-latest, platform: windows }
          - { os: macos-latest, platform: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:gui
      # makensis есть не на всех образах windows-latest.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: command -v makensis || [ -e "C:/Program Files (x86)/NSIS/makensis.exe" ] || choco install nsis -y --no-progress
      # .run на Linux, setup.exe на Windows.
      - name: Installers
        if: runner.os != 'macOS'
        run: node scripts/build.js installer

      # В каталоге md2pdfX-<платформа>-<arch>/ — приложение целиком; tar
      # сохраняет права и символические ссылки внутри .app.
      - name: Archive
        run: |
          mkdir -p out
          for arch in x64 arm64; do
            dir=md2pdfX-$(node -p process.platform)-$arch
            name=md2pdfX-${{ matrix.platform }}-$arch
            if [ "$RUNNER_OS" = Windows ]; then
              (cd dist/gui && 7z a -tzip "../../out/$name.zip" "$dir")
            else
              tar -czf "out/$name.tar.gz" -C dist/gui "$dir"
            fi
          done
          cp dist/gui/*.run dist/gui/*-setup.exe out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}-gui
          path: out/*
          if-no-files-found: error
