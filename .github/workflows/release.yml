# Релиз по ручному запуску: версия берётся из package.json (перед запуском её
# нужно поднять), на GitHub появляется релиз vX.Y.Z с .vsix и исполняемыми
# файлами под Linux, Windows и macOS.
name: release

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Релиз $tag уже есть — поднимите version в package.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      # Полная история — для заметок к первому релизу.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: out

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # md2pdfX-<version>-<platform>-<arch>.<архив>, расширение — md2pdfX-<version>.vsix
          version=${TAG#v}
          mv out/*.vsix "out/md2pdfX-$version.vsix"
          for f in out/md2pdfX-*-*.*; do
            case $f in *.vsix) continue ;; esac
            mv "$f" "out/md2pdfX-$version-${f#out/md2pdfX-}"
          done
          ls out

          # Заметки — изменения с прошлого релиза vX.Y.Z. Сам GitHub взял бы
          # за точку отсчёта последний nightly и показал бы только его хвост.
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
                   --exclude-pre-releases --json tagName --jq '.[].tagName' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$prev" ]; then
            notes=(--generate-notes --notes-start-tag "$prev")
          else
            # Первый релиз: сравнивать не с чем — все коммиты до этого.
            printf '## Changes\n\n' > notes.md
            git log --reverse --pretty='- %s (%h)' "$GITHUB_SHA" >> notes.md
            notes=(--notes-file notes.md)
          fi
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" "${notes[@]}"
