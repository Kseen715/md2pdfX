# Релиз по ручному запуску: версия берётся из package.json (перед запуском её
# нужно поднять), на GitHub появляется релиз vX.Y.Z с .vsix.
name: release

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Релиз $tag уже есть — поднимите version в package.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv *.vsix "md2pdfx-$TAG.vsix"
          gh release create "$TAG" "md2pdfx-$TAG.vsix" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes
